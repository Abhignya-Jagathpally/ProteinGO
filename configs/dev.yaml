# Development scale: 20k training proteins (seeded subset of the v2 training split), references = the subset.
name: dev20k
seed: 0
data:
  subset: 20000
encoder:
  tag: lora35m
  esm: facebook/esm2_t12_35M_UR50D
  lora_r: 16
  lora_from_layer: 8
  n_latents: 16
  depth: 2
  def_init: true
  ia_weight: true
  lr_lora: 3.0e-4
  lr_head: 1.0e-3
  epochs: 4
  max_tokens: 48000
  max_batch: 96
  ret_weight: 0.0
  queue: 4096
retrieval:
  space: ca
  rerank: true
  code_layer: 8
  code_dim: 64
  mode: chainaa0.0       # identity along the embedding alignment: diagonal-run residue matches with the same amino acid
  cands: 100
  k_keep: 50
  k: 8              # neighbours shown to the decoder as evidence
  k_vote: 50        # neighbours in the copy-bias vote
  T: 0.05           # vote sharpening (chain-identity units), chosen on TV v2
decoder:
  t5: google/flan-t5-small
  max_src: 320
  max_tgt: 128
  leaves_per_nb: 8
  epochs: 6
  batch: 96
  lr: 5.0e-4
  constrained: true
  def_init: true
  ia_weight: true
  evidence: true
  copy_bias: true
  member_positions: 4
  shift_weight: true     # resample training queries to the TV top-1 evidence-score distribution
