# B2 localization head (scripts/run_loc.py). 5-fold CV over DeepLoc 2.0 homology partitions.
name: loc
esm: facebook/esm2_t12_35M_UR50D
layer: -1
signal_run: runs/signal/main   # B1 nested-CV heads for the ±signal ablation
head:
  d_in: 480
  d: 256
  heads: 4
  n_out: 10
  hidden: 512
  dropout: 0.25
train:
  epochs: 40
  max_tokens: 12000
  max_batch: 64
  lr: 1.0e-3
  wd: 0.01
  patience: 8
  seed: 0
